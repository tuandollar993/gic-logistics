<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ Thống Báo Cáo & Vận Hành GIC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background-color: var(--gic-navy-950);
            background-image: radial-gradient(circle at 50% 20%, rgba(2, 132, 199, 0.12) 0%, transparent 50%),
                              radial-gradient(circle at 80% 80%, rgba(30, 62, 98, 0.2) 0%, transparent 40%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card-impeccable {
            background: #ffffff;
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .login-brand-strip {
            padding: 32px 28px 24px;
            text-align: center;
            background: #ffffff;
            border-bottom: 1px solid var(--gic-border);
        }
        .login-brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.3rem;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
    </style>
</head>
<body>
    <div class="login-card-impeccable">
        <div class="login-brand-strip">
            <div class="login-brand-icon">
                <i class="fa-solid fa-ship"></i>
            </div>
            <h4 class="fw-bold m-0 text-dark" style="letter-spacing: -0.02em;">GIC LOGISTICS</h4>
            <p class="text-muted small m-0 mt-1">Hệ Thống Báo Cáo & Vận Hành Xuyên Biên Giới</p>
        </div>

        <div class="p-4 pt-3">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show small py-2 mb-3" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted text-uppercase" style="font-size: 0.68rem; letter-spacing: 0.05em;">Tên Đăng Nhập</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-regular fa-user"></i></span>
                        <input type="text" name="username" id="inputUsername" class="form-control border-start-0 ps-1" placeholder="Nhập username..." required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted text-uppercase" style="font-size: 0.68rem; letter-spacing: 0.05em;">Mật Khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" name="password" id="inputPassword" class="form-control border-start-0 ps-1" placeholder="Nhập mật khẩu..." required>
                    </div>
                </div>

                <div class="mb-4 d-flex justify-content-between align-items-center">
                    <div class="form-check">
                        <input type="checkbox" name="remember" class="form-check-input" id="rememberMe">
                        <label class="form-check-label small text-muted" for="rememberMe">Ghi nhớ phiên đăng nhập</label>
                    </div>
                </div>

                <button type="submit" class="btn-primary-gic w-100 py-2 justify-content-center fw-bold fs-6">
                    <span>Đăng Nhập Hệ Thống</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <hr class="my-4">

            <div class="text-center">
                <small class="text-muted fw-bold text-uppercase d-block mb-2" style="font-size: 0.68rem; letter-spacing: 0.06em;">Tài khoản Quản trị hệ thống:</small>
                <div class="d-flex gap-2 justify-content-center flex-wrap">
                    <button type="button" class="btn-secondary-gic py-1 px-3" style="font-size: 0.82rem;" onclick="quickFill('admin', 'admin123')">
                        <i class="fa-solid fa-user-shield text-primary me-1"></i> Quản Lý (admin)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function quickFill(user, pass) {
            document.getElementById('inputUsername').value = user;
            document.getElementById('inputPassword').value = pass;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
